name: release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # -------------------------------------------------------------------------
  # Build for Jetson (aarch64)
  # -------------------------------------------------------------------------
  build-jetson:
    name: Build Jetson binary (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Cross build (default)
        run: cross build --release --target aarch64-unknown-linux-gnu
      - name: Cross build (all features)
        run: cross build --release --target aarch64-unknown-linux-gnu --all-features
      - name: Strip binary
        run: |
          aarch64-linux-gnu-strip target/aarch64-unknown-linux-gnu/release/quilt-jetson
          ls -la target/aarch64-unknown-linux-gnu/release/quilt-jetson
      - name: Upload Jetson binary
        uses: actions/upload-artifact@v7
        with:
          name: quilt-jetson-aarch64
          path: target/aarch64-unknown-linux-gnu/release/quilt-jetson
      - name: Build Debian package
        run: |
          cd ..
          mkdir -p debian-pkg/DEBIAN
          mkdir -p debian-pkg/usr/local/bin
          mkdir -p debian-pkg/etc/quilt
          cp quilt-jetson/target/aarch64-unknown-linux-gnu/release/quilt-jetson debian-pkg/usr/local/bin/
          cat > debian-pkg/DEBIAN/control <<EOF
          Package: quilt-jetson
          Version: ${{ github.ref_name }}
          Section: utils
          Priority: optional
          Architecture: arm64
          Maintainer: SuperInstance <hi@superinstance.dev>
          Description: Quilt reactive runtime for NVIDIA Jetson devices
          EOF
          cat > debian-pkg/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          if ! id -u quilt >/dev/null 2>&1; then
            useradd --system --home /var/lib/quilt --shell /usr/sbin/nologin quilt
          fi
          mkdir -p /var/lib/quilt
          chown -R quilt:quilt /var/lib/quilt
          EOF
          chmod +x debian-pkg/DEBIAN/postinst
          dpkg-deb --build debian-pkg quilt-jetson_${{ github.ref_name }}_arm64.deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: quilt-jetson-deb
          path: ../quilt-jetson_${{ github.ref_name }}_arm64.deb

  # -------------------------------------------------------------------------
  # Build for x86_64 (for completeness)
  # -------------------------------------------------------------------------
  build-x86_64:
    name: Build x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build release
        run: cargo build --release --all-features
      - name: Upload x86_64 binary
        uses: actions/upload-artifact@v7
        with:
          name: quilt-jetson-x86_64
          path: target/release/quilt-jetson

  # -------------------------------------------------------------------------
  # Publish GitHub release
  # -------------------------------------------------------------------------
  release:
    name: GitHub release
    needs: [build-jetson, build-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quilt-jetson-aarch64/quilt-jetson
            quilt-jetson-x86_64/quilt-jetson
            quilt-jetson-deb/quilt-jetson_*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
