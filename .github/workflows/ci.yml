name: ci

on:
  # These triggers used to say `main`. This repository's default branch is
  # `master` and no `main` branch has ever existed, so ci.yml matched no push and
  # no pull request and had produced exactly zero runs. The hardcoded
  # "CI: passing" badge in the README was the only thing asserting CI was green.
  #
  # `master` is the default branch and is what gates CI. `main` is declared in
  # .github/branch-aliases.txt, so this workflow survives the fleet-wide branch
  # convention either way; a filter is a union, so naming an extra branch can
  # only add matches.
  #
  # .github/workflows/ci-trigger-guard.yml asserts all of this on every run. Its
  # own triggers are deliberately UNFILTERED, because a guard that shares the
  # filter it guards cannot fire when that filter breaks.
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  # -------------------------------------------------------------------------
  # Lint and format check
  # -------------------------------------------------------------------------
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Doc
        run: cargo doc --no-deps --all-features

  # -------------------------------------------------------------------------
  # Build and test on x86_64 Linux
  # -------------------------------------------------------------------------
  test:
    name: Test (ubuntu-latest, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build
        run: cargo build --verbose --all-features
      - name: Test
        run: cargo test --verbose --all-features
      - name: Test (no features)
        run: cargo test --verbose
      - name: Doc tests
        run: cargo test --doc --all-features

  # -------------------------------------------------------------------------
  # Cross-compile smoke test for aarch64 (Jetson)
  # -------------------------------------------------------------------------
  cross:
    name: Cross-compile (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Cross build (default features)
        run: cross build --target aarch64-unknown-linux-gnu
      - name: Cross build (all features)
        run: cross build --target aarch64-unknown-linux-gnu --all-features

  # -------------------------------------------------------------------------
  # Coverage
  # -------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run coverage
        run: cargo tarpaulin --verbose --all-features --workspace --timeout 120 --out Xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  # -------------------------------------------------------------------------
  # Examples validation
  # -------------------------------------------------------------------------
  examples:
    name: Validate example sheets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Validate each example
        run: |
          set -e
          for f in examples/*.yaml; do
            echo "Validating $f"
            cargo run --quiet -- validate "$f"
          done

  # -------------------------------------------------------------------------
  # MSRV check
  # -------------------------------------------------------------------------
  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Build (no features)
        run: cargo build
