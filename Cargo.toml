[package]
name = "quilt-jetson"
version = "0.1.0"
edition = "2021"
# The MSRV, declared so cargo enforces it and so the CI job and the
# manifest cannot drift apart again. A Dependabot bump moved the CI
# job's toolchain to 1.120 -- a version that DOES NOT EXIST -- while
# this job was still called "MSRV (1.75)". The name and the toolchain
# disagreed, and the disagreement was invisible until the job tried
# to download a toolchain that had never been released.
  # MSRV, measured rather than guessed. The previous value was 1.75 and it
  # was FALSE from the day it was written.
  #
  # `rust-version` describes OUR crate. It does not describe our
  # dependencies, and the dependencies float. `indexmap = "2"` resolves to
  # 2.14.2, whose manifest declares `edition2024` -- a Cargo feature that
  # did not exist in 1.75, so cargo cannot even PARSE it. We measured the
  # floor by bisecting real toolchains against this exact lockfile:
  #
  #   1.75  -> error: feature `edition2024` is required
  #   1.85  -> icu_normalizer@2.3.0 requires rustc 1.88
  #   1.88  -> uuid@1.28.0 requires rustc 1.89.0
  #   1.89  -> Finished `dev` profile        <-- the floor
  #
  # 1.89 is the minimum that builds this dependency set, so that is what
  # is declared. The CI job is pinned to the same number by
  # `tests/msrv_matches_manifest.rs`, which reads this field and compares
  # it to the toolchain the workflow installs -- so the two cannot drift
  # apart a second time.
  #
  # A declared MSRV is a boundary claim. A wrong one is a defect, not a
  # conservative default.
  rust-version = "1.89"
description = "Quilt reactive runtime for NVIDIA Jetson devices — edge ML, ROS2, vision, federation"
license = "Apache-2.0"
authors = ["The Quilt Authors"]
repository = "https://github.com/SuperInstance/quilt-jetson"
homepage = "https://superinstance.github.io/quilt/"
readme = "README.md"
keywords = ["reactive", "cells", "ros2", "jetson", "edge", "tier", "federation"]
categories = ["embedded", "robotics", "science::robotics", "web-programming"]
publish = false

[lib]
name = "quilt_jetson"
path = "src/lib.rs"

# Binary target — the `quilt-jetson` CLI that loads a sheet, starts the
# web server, and exposes the federation endpoints.
[[bin]]
name = "quilt-jetson"
path = "src/bin/quilt_jetson.rs"

[dependencies]
# Async runtime — full features. We are an async crate all the way down
# (different from the sync core engine in quilt-rust, because the Jetson
# runtime is centered on long-running tokio tasks: ROS2 subscribers,
# vision inference loops, federation WebSockets, etc).
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization — sheets are YAML, values are JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Embedded scripting for `program` and `formula` cells
rhai = { version = "1.20", features = ["sync", "serde"] }

# Web server + federation transport
axum = { version = "0.7", features = ["ws", "macros"] }
# `rustls-tls`, not `native-tls`, and this is a Jetson repo.
# `native-tls` pulls in `openssl-sys`, which needs a system OpenSSL for the
# TARGET. That made the aarch64 cross job die in `openssl-sys`'s build
# script with "Package 'openssl' ... not found" -- an environment failure
# masquerading as a code failure. `reqwest` in this manifest already chose
# `rustls-tls`; the websocket client was the odd one out. Rustls is pure
# Rust, so it cross-compiles without a target sysroot.
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "trace"] }

# HTTP client — used by `api` cells, the federation client, vision cell
# `api://` shims, and the LLM/AI cell.
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# MQTT — used by `io` cells that want to talk to an MQTT broker
rumqttc = "0.24"

# Local persistence — async SQLite for cell history
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "json", "macros"] }

# Math — sensor fusion, vision, transforms
nalgebra = { version = "0.32", features = ["serde-serialize"] }

# `image` and `imageproc` WERE HERE, and nothing used them.
#
# Measured on 2026-10-20:
#     grep -rn "image::\|imageproc::\|use image" --include=*.rs .
#     -> zero hits outside target/
#
# Two declared dependencies that no source file references. And they were
# expensive: `image`'s DEFAULT feature set pulls `avif` -> `exr` -> `pulp`,
# a SIMD-intrinsics crate that does not compile under
# `-Clink-dead-code`:
#
#     error[E0080]: evaluation panicked: assertion failed:
#       core::mem::size_of::<T>() == core::mem::size_of::<U>()
#     --> pulp-0.22.3/src/lib.rs:3291
#     could not compile `pulp` (lib) due to 10 previous errors
#
# That is what made the coverage job red. `cargo check` and `cargo clippy`
# pass with the same dependency, because they check rather than build --
# which is exactly why a green lint job sat next to a red coverage job for
# months without the contradiction being visible.
#
# Vision decoding belongs here when it is actually used, and it should go
# through the `vision-onnx` feature's TensorRT path anyway -- a pure-Rust
# decoder that nothing calls is not coverage, it is a liability.

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI parsing for the `quilt-jetson` binary
clap = { version = "4.5", features = ["derive", "env"] }

# Misc utilities
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
indexmap = { version = "2", features = ["serde"] }
once_cell = "1.19"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1.10"
url = "2.5"
bytes = "1.6"

# The rclrs (pure-Rust ROS2 client) is OPTIONAL because installing ROS2
# on a development machine is a heavy install. We make it a feature so
# that `cargo build` works out-of-the-box and `cargo build --features
# ros2` brings in the real bridge. Tests for the bridge live in the
# `tests/ros2_bridge.rs` integration test, which is `#[ignore]`d by
# default to keep CI fast.
rclrs = { version = "0.1", optional = true }

# Likewise, the actual ONNX runtime (ort) is a large dependency with
# platform-specific wheels. We abstract it behind a feature so the MVP
# can build and run everywhere. The `vision` module uses a pure-Rust
# stub when this feature is off.
# `ort = "2"` RESOLVED TO NOTHING, and it broke EVERY cargo command --
# including the ones that do not use it. The published versions are all
# PRE-RELEASES (2.0.0-rc.N), and cargo excludes a pre-release from a
# plain `^2` requirement unless the requirement NAMES it. The feature
# is optional, so this read like an inert line; it was not: an
# unresolvable dependency breaks the lockfile, and the lockfile breaks
# the build, the tests, the fmt check and the publish.
ort = { version = "=2.0.0-rc.14", optional = true }

[features]
default = []
ros2 = ["dep:rclrs"]
vision-onnx = ["dep:ort"]
all = ["ros2", "vision-onnx"]

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
wiremock = "0.6"
httpmock = "0.7"
serial_test = "3"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Cross-compile profile for Jetson (aarch64-unknown-linux-gnu). This
# is what the release workflow invokes. The link-time optimisations
# make the binary ~40% smaller and a bit faster.
[profile.release-jetson]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true
